[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-agent"
version = "0.1.0"
description = "長者照護雷達資料的知識圖譜與事件驗證"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.18",
    "rfc3339-validator>=0.1.4",  # 讓 Schema 的 date-time 格式真的被檢查
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.16,<0.17",  # 限制版本範圍：ruff 更新預設規則時不會讓 CI 無故變紅，要升級時再手動改
    "mypy>=1.10,<2",
    "pyyaml>=6",         # tests/test_packaging.py 解析 CI 的 YAML
]

# 安裝後可在任何目錄使用這些指令
[project.scripts]
radar-kg-manifest = "radar_agent.kg_manifest:main"
radar-kg-build = "radar_agent.kg_source:main"
radar-kg-level = "radar_agent.kg_rules:main"

[tool.setuptools.packages.find]
where = ["src"]

# 注意：程式會讀 repo 裡的 schemas/、kg/，所以必須用可編輯安裝（pip install -e .），
# 不能打包成一般的 wheel 再安裝到別處。

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# 明確列出規則，結果不依賴 ruff 版本的預設規則集。
select = ["E4", "E7", "E9", "F", "W", "B", "UP", "SIM", "DTZ", "RUF", "ISC", "PLW", "C4", "PIE"]
ignore = [
    "DTZ001", "DTZ007",                # 資料的時間戳沒有時區（會議清單 A4、A27），刻意使用沒有時區的 datetime
    "RUF001", "RUF002", "RUF003",      # 全形標點（，、：（））是繁體中文的正常寫法，不是可疑字元
]

[tool.mypy]
files = ["src"]
python_version = "3.11"
strict = true
ignore_missing_imports = true          # jsonschema 沒有型別標註

[tool.coverage.run]
source = ["radar_agent"]
branch = true

[tool.coverage.report]
fail_under = 95                        # 低於這個比例，pytest --cov 會以非零結束
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]   # 進入點由 tests/test_packaging.py 以 subprocess 測，不計入
