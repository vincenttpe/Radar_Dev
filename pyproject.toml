[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-agent"
version = "0.1.0"
description = "長者照護雷達資料的週報、知識圖譜與事件驗證"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.18",
    "rfc3339-validator>=0.1.4",  # 讓 Schema 的 date-time 格式真的被檢查
]

[project.optional-dependencies]
dev = ["pytest>=8"]

# 安裝後可在任何目錄使用這兩個指令
[project.scripts]
radar-weekly-report = "radar_agent.weekly_report:main"
radar-kg-manifest = "radar_agent.kg_manifest:main"
radar-kg-build = "radar_agent.kg_source:main"

[tool.setuptools.packages.find]
where = ["src"]

# 注意：程式會讀 repo 裡的 schemas/、kg/，所以必須用可編輯安裝（pip install -e .），
# 不能打包成一般的 wheel 再安裝到別處。

# 資料的時間戳沒有時區（會議清單 A4），程式與測試刻意使用沒有時區的 datetime。
[tool.ruff.lint]
extend-ignore = ["DTZ001"]
