name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - name: 指令列工具能用（驗證 pyproject.toml 的 scripts）
        run: |
          radar-weekly-report --input data/samples_fall/2026-06-03.json | head -5
          radar-kg-manifest --check
