name: secrets

# 密碼與金鑰掃描（gitleaks）：部分替代沒開的 Secret scanning（私人 repo 要付費，README「GitHub repo 設定」）。
# PR 與 push 到 main 只掃新增的 commit；每週一與手動執行時掃全部分支的完整歷史。掃描邏輯在 .github/scripts/secret-scan.sh。
# 結果一律遮罩（--redact），log 裡不出現密碼本身，但會列出檔案、行號、commit 與作者 email；不上傳報告檔。
# 掃到東西時由人決定要不要換密碼、要不要列進允許清單（.github/gitleaks.toml、.github/gitleaksignore），不自動改歷史。
# 限制：只在 push 之後才發現，擋不住 push 本身；gitleaks 預設跳過的路徑（例如 node_modules/、lock 檔、*.pdf）、含 NUL 的二進位內容、LFS 檔與 commit 訊息不掃。
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 1 * * 1"   # 每週一 01:17 UTC（台灣 09:17）
  workflow_dispatch:

permissions:
  contents: read

env:
  # 固定版本並核對 checksum（來源：該版本 release 的 gitleaks_<版本>_checksums.txt）
  GITLEAKS_VERSION: 8.28.0
  GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 要有完整歷史才能掃 commit 範圍
      - name: 安裝 gitleaks（核對 checksum）
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: 掃描
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) bash .github/scripts/secret-scan.sh "$RUNNER_TEMP/gitleaks" "$BASE_SHA" "$HEAD_SHA" ;;
            push)         bash .github/scripts/secret-scan.sh "$RUNNER_TEMP/gitleaks" "$BEFORE_SHA" "$AFTER_SHA" ;;
            *)            bash .github/scripts/secret-scan.sh "$RUNNER_TEMP/gitleaks" ;;
          esac
